<svg xmlns="http://www.w3.org/2000/svg" width="600" height="344" viewBox="0 0 600 344" role="img" aria-label="Your project here">
<defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20203f"/><stop offset="1" stop-color="#0e0e1f"/></linearGradient><linearGradient id="pbd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BF5AF2" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#FF375F" stop-opacity=".85"/></linearGradient><linearGradient id="cv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BF5AF2"/><stop offset=".55" stop-color="#FF375F"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient>
