<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}

.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.fl{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 3.6s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.ln{stroke-dasharray:300;stroke-dashoffset:300;animation:ln 3.6s ease-in-out infinite}
@keyframes ln{0%{stroke-dashoffset:300}60%,100%{stroke-dashoffset:0}}
.ring{animation:rg 4s ease-in-out infinite}
@keyframes rg{0%{stroke-dasharray:0 100}60%,100%{stroke-dasharray:72 100}}
.arr{animation:ar 1.4s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}</style>
<g transform="translate(4 4)"><rect width="592" height="332" rx="32" fill="url(#pbg)" filter="url(#sd)"/>
