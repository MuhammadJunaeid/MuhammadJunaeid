  <text x="76" y="328" font-size="18" font-weight="400" fill="#CBD5E1">Extended Berkeley Packet Filter allows developers to safely execute sandboxed programs inside</text>
<text x="76" y="360" font-size="18" font-weight="400" fill="#CBD5E1">the Linux kernel without changing kernel source code or loading kernel modules. It matters</text>
<text x="76" y="392" font-size="18" font-weight="400" fill="#CBD5E1">because it provides deep, real-time observability and security enforcement with minimal</text>
<text x="76" y="424" font-size="18" font-weight="400" fill="#CBD5E1">performance overhead. It works by attaching bytecode programs to kernel hooks, tracepoints, or</text>
<text x="76" y="456" font-size="18" font-weight="400" fill="#CBD5E1">user-space probes, verifying safety statically before execution via an in-kernel verifier, and</text>
<text x="76" y="488" font-size="18" font-weight="400" fill="#CBD5E1">passing telemetry to user space using efficient maps. A practical use case is runtime</text>
<text x="76" y="520" font-size="18" font-weight="400" fill="#CBD5E1">intrusion detection, where security agents monitor system calls dynamically to flag anomalous</text>
<text x="76" y="552" font-size="18" font-weight="400" fill="#CBD5E1">process behavior instantly.</text>

