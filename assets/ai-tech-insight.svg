<title id="svg-title">Homomorphic Encryption in Secure Cloud Analytics</title>

<desc id="svg-description">
Homomorphic encryption allows direct mathematical computations on encrypted data without requiring prior decryption. This mechanism relies on algebraic structures like lattices, where specific operations on ciphertexts mirror corresponding operations on plaintexts. It matters because it fundamentally resolves the tension between cloud scalability and strict data confidentiality, ensuring sensitive intellectual property or personal identifiable information remains completely opaque to hosting providers during processing. A practical real-world use case involves healthcare platforms running machine learning diagnostic models on encrypted patient genomic sequences hosted in public cloud infrastructure, ensuring regulatory compliance without sacrificing analytical capability.
</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0B191C"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#34D399"/>
    <stop offset="100%" stop-color="#A78BFA"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#34D399" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".10"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 8s ease-in-out infinite alternate;
  }

  .artwork {
    transform-box: fill-box;
    transform-origin: center;
    animation: breathe 6s ease-in-out infinite alternate;
  }

  .accent-line {
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { opacity: .15; transform: translateY(0); }
    to { opacity: .45; transform: translateY(8px); }
  }

  @keyframes breathe {
    from { opacity: .85; }
    to { opacity: 1; }
  }

  @keyframes shimmer {
    from { opacity: .7; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .artwork, .accent-line {
      animation: none;
    }
  }
</style>

