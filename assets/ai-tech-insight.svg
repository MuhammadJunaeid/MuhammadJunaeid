  <text x="76" y="407" font-size="18" font-weight="400" fill="#CBD5E1">A Software Bill of Materials acts as a structured inventory of all open-source and proprietary</text>
<text x="76" y="439" font-size="18" font-weight="400" fill="#CBD5E1">components within a software artifact. It matters because modern applications rely heavily on</text>
<text x="76" y="471" font-size="18" font-weight="400" fill="#CBD5E1">transitive dependencies, making vulnerability tracking nearly impossible without comprehensive</text>
<text x="76" y="503" font-size="18" font-weight="400" fill="#CBD5E1">component visibility. It works by programmatically scanning source trees or binary builds during</text>
<text x="76" y="535" font-size="18" font-weight="400" fill="#CBD5E1">the CI pipeline to output machine-readable dependency graphs in formats like SPDX or CycloneDX.</text>
<text x="76" y="567" font-size="18" font-weight="400" fill="#CBD5E1">These documents catalog cryptographic hashes, version numbers, and supplier identities. A</text>
<text x="76" y="599" font-size="18" font-weight="400" fill="#CBD5E1">practical use case involves enterprise security teams automatically ingesting these inventories</text>
<text x="76" y="631" font-size="18" font-weight="400" fill="#CBD5E1">into vulnerability management platforms to instantly flag newly disclosed zero-day flaws across</text>
<text x="76" y="663" font-size="18" font-weight="400" fill="#CBD5E1">thousands of microservices.</text>

