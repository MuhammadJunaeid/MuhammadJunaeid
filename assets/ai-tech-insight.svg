<title id="svg-title">Mitigating Side Channel Timing Attacks with Constant Time Cryptography</title>

<desc id="svg-description">
Side channel timing attacks exploit execution time variations in cryptographic algorithms to extract secret keys. If a conditional branch or memory lookup takes longer when a byte matches, an attacker can statistically recover the data. Constant time programming ensures that execution paths and memory access patterns are independent of sensitive inputs. Developers achieve this by replacing secret dependent branches with bitwise operations and avoiding data dependent array indexing, forcing the CPU to execute the exact same instruction sequence regardless of the underlying secret state.
</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#17190C"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#FBBF24"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#FBBF24" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".10"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 8s ease-in-out infinite alternate;
  }

  .artwork {
    transform-box: fill-box;
    transform-origin: center;
    animation: breathe 6s ease-in-out infinite alternate;
  }

  .accent-line {
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { opacity: .15; transform: translateY(0); }
    to { opacity: .45; transform: translateY(8px); }
  }

  @keyframes breathe {
    from { opacity: .85; }
    to { opacity: 1; }
  }

  @keyframes shimmer {
    from { opacity: .7; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .artwork, .accent-line {
      animation: none;
    }
  }
</style>

