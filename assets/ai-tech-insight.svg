  <text x="76" y="358" font-size="18" font-weight="400" fill="#CBD5E1">Prompt injection remains a critical vulnerability where malicious user input hijacks language</text>
<text x="76" y="390" font-size="18" font-weight="400" fill="#CBD5E1">model execution by overriding system instructions. To mitigate this risk, modern architectures</text>
<text x="76" y="422" font-size="18" font-weight="400" fill="#CBD5E1">employ a dual-LLM control flow pattern. The primary execution model handles user requests in an</text>
<text x="76" y="454" font-size="18" font-weight="400" fill="#CBD5E1">isolated context without direct system authority. A secondary, privileged guardrail model analyzes</text>
<text x="76" y="486" font-size="18" font-weight="400" fill="#CBD5E1">incoming payloads and execution outputs against strict structural invariants before downstream</text>
<text x="76" y="518" font-size="18" font-weight="400" fill="#CBD5E1">execution. By completely decoupling intent classification and data ingestion from execution logic,</text>
<text x="76" y="550" font-size="18" font-weight="400" fill="#CBD5E1">applications prevent indirect prompt manipulation while maintaining high throughput for autonomous</text>
<text x="76" y="582" font-size="18" font-weight="400" fill="#CBD5E1">agent workflows.</text>

