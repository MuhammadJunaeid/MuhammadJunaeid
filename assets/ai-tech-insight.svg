 <text x="265" y="321" font-size="36" font-weight="750" letter-spacing="4" fill="#F472B6">SYSTEMS &amp; ARCHITECTURE</text>
 <text x="220" y="440.0" font-size="80" fill="#F0FDFA" font-weight="800" >Understanding Database Connection</text>
<text x="220" y="529.0" font-size="80" fill="#F0FDFA" font-weight="800" >Pooling Trade-offs</text>
 <rect x="220" y="681" width="270" height="48" rx="24" fill="#34D399" fill-opacity=".13" stroke="#34D399" stroke-opacity=".35"/>
 <text x="250" y="714" font-size="25" font-weight="750" letter-spacing="3" fill="#34D399">THE INSIGHT</text>
 <text x="220" y="763.0" font-size="39" fill="#DCE7FA" font-weight="430" >Database connection pooling reduces the overhead of establishing TCP connections for</text>
<text x="220" y="816.0" font-size="39" fill="#DCE7FA" font-weight="430" >every incoming request. By maintaining a reusable pool of active sockets, applications</text>
<text x="220" y="869.0" font-size="39" fill="#DCE7FA" font-weight="430" >decrease latency and conserve database memory. However, setting the pool size too high</text>
<text x="220" y="922.0" font-size="39" fill="#DCE7FA" font-weight="430" >exhausts database resources and causes thread contention. Setting it too low creates</text>
<text x="220" y="975.0" font-size="39" fill="#DCE7FA" font-weight="430" >queuing bottlenecks during traffic spikes. Developers must tune pool sizes based on</text>
<text x="220" y="1028.0" font-size="39" fill="#DCE7FA" font-weight="430" >available CPU cores and actual query execution time. Proper monitoring prevents silent</text>
<text x="220" y="1081.0" font-size="39" fill="#DCE7FA" font-weight="430" >failures under heavy load.</text>
