rticle" style="animation-delay:-6s"/><circle cx="194" cy="174" r="1" fill="#60A5FA" class="particle" style="animation-delay:-0s"/><circle cx="340" cy="186" r="3" fill="#60A5FA" class="particle" style="animation-delay:-2s"/><circle cx="77" cy="27" r="2" fill="#60A5FA" class="particle" style="animation-delay:-3s"/><circle cx="873" cy="175" r="1" fill="#60A5FA" class="particle" style="animation-delay:-8s"/><circle cx="954" cy="158" r="1" fill="#60A5FA" class="particle" style="animation-delay:-7s"/><circle cx="349" cy="63" r="3" fill="#60A5FA" class="particle" style="animation-delay:-5s"/>
