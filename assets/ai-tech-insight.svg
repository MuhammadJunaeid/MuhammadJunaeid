<text x="220" y="1007.0" font-size="39" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">early data relies on previously negotiated preshared keys. However, attackers can</text>
<text x="220" y="1059.0" font-size="39" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">intercept and replay these initial unauthenticated packets to the server. If the server</text>
<text x="220" y="1111.0" font-size="39" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">processes non-idempotent HTTP requests in early data, state changes occur multiple</text>
<text x="220" y="1163.0" font-size="39" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">times. To prevent replay attacks, servers must implement single-use ticket keys or</text>
<text x="220" y="1215.0" font-size="39" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">maintain a bloom filter of recent connection identifiers. Alternatively, applications</text>
<text x="220" y="1267.0" font-size="39" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">must restrict 0-RTT to strictly idempotent GET requests. Failing to isolate early data</text>
<text x="220" y="1319.0" font-size="39" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">exposes backend APIs to duplicate transactions. Proper TLS configuration requires</text>
<text x="220" y="1371.0" font-size="39" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">explicit white-listing of safe application endpoints.</text>

