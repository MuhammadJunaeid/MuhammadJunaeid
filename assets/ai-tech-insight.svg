<title id="svg-title">Mitigating Prompt Injection via Dual-LLM Control Flow</title>

<desc id="svg-description">
Prompt injection remains a critical vulnerability where malicious user input hijacks language model execution by overriding system instructions. To mitigate this risk, modern architectures employ a dual-LLM control flow pattern. The primary execution model handles user requests in an isolated context without direct system authority. A secondary, privileged guardrail model analyzes incoming payloads and execution outputs against strict structural invariants before downstream execution. By completely decoupling intent classification and data ingestion from execution logic, applications prevent indirect prompt manipulation while maintaining high throughput for autonomous agent workflows.
</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#100D25"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#A78BFA"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#A78BFA" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".10"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 8s ease-in-out infinite alternate;
  }

  .artwork {
    transform-box: fill-box;
    transform-origin: center;
    animation: breathe 6s ease-in-out infinite alternate;
  }

  .accent-line {
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { opacity: .15; transform: translateY(0); }
    to { opacity: .45; transform: translateY(8px); }
  }

  @keyframes breathe {
    from { opacity: .85; }
    to { opacity: 1; }
  }

  @keyframes shimmer {
    from { opacity: .7; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .artwork, .accent-line {
      animation: none;
    }
  }
</style>

