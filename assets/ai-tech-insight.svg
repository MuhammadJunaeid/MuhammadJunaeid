<svg xmlns="http://www.w3.org/2000/svg"
width="1200" height="917"
viewBox="0 0 1200 917"
role="img" aria-labelledby="svg-title svg-description">

<title id="svg-title">eBPF Kernel Observability</title>
<desc id="svg-description">Extended Berkeley Packet Filter allows developers to safely execute sandboxed programs inside the Linux kernel without changing kernel source code or loading kernel modules. It matters because it provides deep, real-time observability and security enforcement with minimal performance overhead. It works by attaching bytecode programs to kernel hooks, tracepoints, or user-space probes, verifying safety statically before execution via an in-kernel verifier, and passing telemetry to user space using efficient maps. A practical use case is runtime intrusion detection, where security agents monitor system calls dynamically to flag anomalous process behavior instantly.</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#17190C"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#FBBF24"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#FBBF24" stop-opacity=".20"/>
    <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="34" height="34"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".17"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 7s ease-in-out infinite alternate;
  }

  .orbit {
    transform-box: fill-box;
    transform-origin: center;
    animation: rotate 35s linear infinite;
  }

  .pulse {
    animation: pulse 4s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { transform: translateY(-5px); opacity: .2; }
    to { transform: translateY(12px); opacity: .8; }
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes pulse {
    from { opacity: .1; }
    to { opacity: .35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .orbit, .pulse { animation: none; }
  }
</style>

