<text x="76" y="422" font-size="18" font-weight="400" fill="#CBD5E1">scheduler. This approach eliminates non-deterministic concurrency bugs and race conditions that</text>
<text x="76" y="454" font-size="18" font-weight="400" fill="#CBD5E1">evade traditional testing. By intercepting all system calls, time progression, and network I/O,</text>
<text x="76" y="486" font-size="18" font-weight="400" fill="#CBD5E1">the framework can record, replay, and exhaustively search edge-case failure states in milliseconds</text>
<text x="76" y="518" font-size="18" font-weight="400" fill="#CBD5E1">rather than days.</text>

