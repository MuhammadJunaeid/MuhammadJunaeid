    <stop offset="0%" stop-color="#100D20"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#A78BFA"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>

  <radialGradient id="glow">
