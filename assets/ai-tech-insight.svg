<text x="76" y="486" font-size="18" font-weight="400" fill="#CBD5E1">private keys by measuring instruction latency. It works by replacing secret-dependent conditional</text>
<text x="76" y="518" font-size="18" font-weight="400" fill="#CBD5E1">branches with bitwise operations and using lookup-free math routines. A practical use case is</text>
