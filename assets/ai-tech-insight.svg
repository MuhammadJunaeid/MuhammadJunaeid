 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset=".52" stop-color="#60A5FA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
