<title id="svg-title">CRDTs in Local First Software</title>

<desc id="svg-description">
Conflict Free Replicated Data Types enable distributed systems to merge concurrent updates mathematically without requiring central coordination or locking. By defining data structures with algebraic properties like commutativity and associativity, client applications can mutate local state offline and reliably synchronize peer to peer later. This matters because it eliminates network latency bottlenecks and creates resilient applications that function seamlessly without continuous internet connectivity. Developers use CRDTs to build real time collaborative text editors and offline first mobile apps that resolve merge conflicts automatically and deterministically across all connected devices.
</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#100D20"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#A78BFA"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#A78BFA" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32"
