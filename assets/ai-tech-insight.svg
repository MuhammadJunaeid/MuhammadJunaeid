    <text x="220" y="903.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">Optimistic Concurrency Control assumes conflicts are rare. Instead of</text>
<text x="220" y="955.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">locking database rows, it allows multiple transactions to read data</text>
<text x="220" y="1007.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">simultaneously. Each record receives a version number or timestamp. When a</text>
<text x="220" y="1059.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">transaction attempts to write, the database checks if the stored version</text>
<text x="220" y="1111.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">matches the read version. If they match, the update succeeds and the version</text>
<text x="220" y="1163.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">increments. If a concurrent transaction modified the record first, the</text>
<text x="220" y="1215.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">version check fails. The current transaction rolls back and must retry. This</text>
<text x="220" y="1267.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">mechanism prevents race conditions in high-throughput APIs without the</text>
<text x="220" y="1319.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">performance bottlenecks of pessimistic locking. However, high contention</text>
<text x="220" y="1371.0" font-size="38" fill="#E2EAF8" font-weight="450" letter-spacing="0.15">causes repeated rollbacks, which degrades throughput.</text>

