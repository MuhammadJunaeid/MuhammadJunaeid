  @keyframes breathe {
    from { opacity: .85; }
    to { opacity: 1; }
  }

  @keyframes shimmer {
    from { opacity: .7; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .artwork, .accent-line {
      animation: none;
    }
  }
</style>

