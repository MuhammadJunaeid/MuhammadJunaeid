<svg xmlns="http://www.w3.org/2000/svg"
width="1200"
height="1049"
viewBox="0 0 1200 1049"
preserveAspectRatio="xMidYMid meet"
role="img"
aria-labelledby="svg-title svg-description">

<title id="svg-title">Mitigating Supply Chain Vulnerabilities with Software Bill of Materials</title>

<desc id="svg-description">
A Software Bill of Materials acts as a structured inventory of all open-source and proprietary components within a software artifact. It matters because modern applications rely heavily on transitive dependencies, making vulnerability tracking nearly impossible without comprehensive component visibility. It works by programmatically scanning source trees or binary builds during the CI pipeline to output machine-readable dependency graphs in formats like SPDX or CycloneDX. These documents catalog cryptographic hashes, version numbers, and supplier identities. A practical use case involves enterprise security teams automatically ingesting these inventories into vulnerability management platforms to instantly flag newly disclosed zero-day flaws across thousands of microservices.
</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#17190C"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#FBBF24"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#FBBF24" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".10"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 8s ease-in-out infinite alternate;
  }

  .artwork {
    transform-box: fill-box;
    transform-origin: center;
    animation: breathe 6s ease-in-out infinite alternate;
  }

  .accent-line {
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { opacity: .15; transform: translateY(0); }
    to { opacity: .45; transform: translateY(8px); }
  }

  @keyframes breathe {
    from { opacity: .85; }
    to { opacity: 1; }
  }

  @keyframes shimmer {
    from { opacity: .7; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .artwork, .accent-line {
      animation: none;
    }
  }
</style>

