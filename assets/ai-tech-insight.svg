    </pattern>

    <filter id="softGlow"
            x="-80%" y="-80%"
            width="260%" height="260%">
        <feGaussianBlur stdDeviation="18" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <filter id="shadow"
            x="-20%" y="-20%"
            width="140%" height="150%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
        <feOffset dy="12"/>
        <feComponentTransfer>
            <feFuncA type="linear" slope=".28"/>
        </feComponentTransfer>
        <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <style>
        text {
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        .particle {
            animation: float 9s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: center;
        }

        .p1,.p8,.p16,.p25 { animation-delay: -3s; }
        .p2,.p9,.p17,.p26 { animation-delay: -6s; }

        .hero-art {
            transform-origin: 2940px 1000px;
            animation: heroFloat 12s ease-in-out infinite alternate;
        }

        .orbit {
            transform-origin: 2940px 1000px;
            animation: orbit 48s linear infinite;
        }

        .pulse {
            transform-origin: center;
            animation: pulse 3.8s ease-in-out infinite;
        }

        .node {
            animation: nodeGlow 3s ease-in-out infinite alternate;
            filter: url(#softGlow);
        }

        .data-stream {
            animation: stream 5s ease-in-out infinite alternate;
            filter: url(#softGlow);
        }

        .scan {
            animation: scan 8s ease-in-out infinite;
        }

        @keyframes float {
            from {
                transform: translate3d(0,18px,0);
                opacity: .2;
            }
            to {
                transform: translate3d(0,-28px,0);
                opacity: .8;
            }
        }

        @keyframes heroFloat {
            from {
                transform: translateY(12px) scale(.99);
            }
            to {
                transform: translateY(-16px) scale(1.015);
            }
        }

        @keyframes orbit {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%,100% {
                opacity: .65;
                transform: scale(.88);
            }
            50% {
                opacity: 1;
                transform: scale(1.12);
            }
        }

        @keyframes nodeGlow {
            from { opacity: .45; }
            to { opacity: 1; }
        }

        @keyframes stream {
            from { opacity: .35; }
            to { opacity: 1; }
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            15% { opacity: .45; }
            85% { opacity: .15; }
            100% {
                transform: translateY(700px);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,*::before,*::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</defs>

