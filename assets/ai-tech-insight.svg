<title id="svg-title">Fuzzing Async State Machines</title>

<desc id="svg-description">
Asynchronous state machines in modern languages transform complex async/await control flows into heavily nested poll-based structures. This transition introduces subtle race conditions and memory corruption vectors that traditional unit tests frequently miss. Fuzzing these state machines involves generating randomized execution interleavings and injecting simulated I/O delays directly into the poll loop. This matters because it exposes hidden concurrency bugs and deadlocks before code reaches production environments. By instrumenting the compiler output to track state transitions, developers can systematically explore edge cases in asynchronous protocol parsers and distributed consensus runtimes.
</desc>

<defs>
