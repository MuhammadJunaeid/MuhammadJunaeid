<g font-family="Inter,'Segoe UI',Arial,sans-serif">
 <text x="220" y="205" font-size="58" font-weight="850" letter-spacing="5" fill="#F0FDFA">JUNAEID <tspan fill="#10B981">/</tspan> TECH JOURNAL</text>
 <rect x="220" y="278" width="12" height="58" rx="6" fill="url(#accent)"/>
 <text x="265" y="321" font-size="36" font-weight="750" letter-spacing="4" fill="#FB7185">SYSTEMS &amp; ARCHITECTURE</text>
 <text x="220" y="440.0" font-size="80" fill="#F0FDFA" font-weight="800" >Understanding Write Amplification</text>
<text x="220" y="529.0" font-size="80" fill="#F0FDFA" font-weight="800" >in LSM-Trees versus B-Trees</text>
 <rect x="220" y="681" width="270" height="48" rx="24" fill="#10B981" fill-opacity=".13" stroke="#10B981" stroke-opacity=".35"/>
 <text x="250" y="714" font-size="25" font-weight="750" letter-spacing="3" fill="#10B981">THE INSIGHT</text>
 <text x="220" y="763.0" font-size="39" fill="#DCE7FA" font-weight="430" >Database storage engines choose different tradeoffs for read and write performance.</text>
<text x="220" y="816.0" font-size="39" fill="#DCE7FA" font-weight="430" >Traditional B-Trees update data in place on fixed-size pages. This approach creates high</text>
<text x="220" y="869.0" font-size="39" fill="#DCE7FA" font-weight="430" >write amplification because minor updates rewrite entire disk pages. Random writes</text>
<text x="220" y="922.0" font-size="39" fill="#DCE7FA" font-weight="430" >suffer significantly under this model. In contrast, Log-Structured Merge-trees write</text>
<text x="220" y="975.0" font-size="39" fill="#DCE7FA" font-weight="430" >incoming updates sequentially to an in-memory buffer called a MemTable. Once full, the</text>
<text x="220" y="1028.0" font-size="39" fill="#DCE7FA" font-weight="430" >buffer flushes sequentially to disk as an immutable SSTable. Background compaction</text>
<text x="220" y="1081.0" font-size="39" fill="#DCE7FA" font-weight="430" >processes later merge and clean these sorted tables. This architecture converts random</text>
<text x="220" y="1134.0" font-size="39" fill="#DCE7FA" font-weight="430" >writes into fast sequential writes. However, LSM-trees increase read latency because</text>
<text x="220" y="1187.0" font-size="39" fill="#DCE7FA" font-weight="430" >queries must scan multiple SSTables. Developers must evaluate workload patterns</text>
<text x="220" y="1240.0" font-size="39" fill="#DCE7FA" font-weight="430" >carefully. High-throughput write applications benefit from LSM-trees, whereas read-heavy</text>
<text x="220" y="1293.0" font-size="39" fill="#DCE7FA" font-weight="430" >systems favor B-Trees.</text>
 <g filter="url(#shadow)"><rect x="220" y="1404" width="1850" height="269" rx="34" fill="#FFFFFF" fill-opacity=".065" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/><rect x="220" y="1404" width="12" height="269" rx="6" fill="url(#accent)"/></g>
 <text x="300" y="1474" font-size="29" font-weight="850" letter-spacing="4" fill="#FB7185">KEY TAKEAWAY</text>
 <text x="300" y="1524.0" font-size="31" fill="#F0FDFA" font-weight="650" >Choose LSM-tree engines for write-heavy workloads with</text>
<text x="300" y="1566.0" font-size="31" fill="#F0FDFA" font-weight="650" >sequential access, and use B-Trees when point-read latency is</text>
<text x="300" y="1608.0" font-size="31" fill="#F0FDFA" font-weight="650" >your primary bottleneck.</text>
