  <!-- Full explanation -->
  <text x="76" y="407" font-size="18" font-weight="400" fill="#CBD5E1">Side channel timing attacks exploit execution time variations in cryptographic algorithms to</text>
<text x="76" y="439" font-size="18" font-weight="400" fill="#CBD5E1">extract secret keys. If a conditional branch or memory lookup takes longer when a byte matches, an</text>
<text x="76" y="471" font-size="18" font-weight="400" fill="#CBD5E1">attacker can statistically recover the data. Constant time programming ensures that execution</text>
<text x="76" y="503" font-size="18" font-weight="400" fill="#CBD5E1">paths and memory access patterns are independent of sensitive inputs. Developers achieve this by</text>
<text x="76" y="535" font-size="18" font-weight="400" fill="#CBD5E1">replacing secret dependent branches with bitwise operations and avoiding data dependent array</text>
<text x="76" y="567" font-size="18" font-weight="400" fill="#CBD5E1">indexing, forcing the CPU to execute the exact same instruction sequence regardless of the</text>
<text x="76" y="599" font-size="18" font-weight="400" fill="#CBD5E1">underlying secret state.</text>

