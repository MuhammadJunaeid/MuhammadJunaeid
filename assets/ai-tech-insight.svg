<title id="svg-title">Coroutines and Structured Concurrency</title>

<desc id="svg-description">
Structured concurrency binds the lifecycle of concurrent asynchronous tasks to specific lexical scopes, preventing orphaned background operations and resource leaks. Unlike unstructured threads that can escape their origin contexts, structured models ensure that child coroutines always complete before their parent scope exits. This hierarchical execution model guarantees deterministic cancellation propagation and predictable error handling across complex asynchronous pipelines, drastically simplifying concurrency debugging in modern distributed and reactive applications.
</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091625"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#60A5FA"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#60A5FA" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".10"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 8s ease-in-out infinite alternate;
  }

  .artwork {
    transform-box: fill-box;
    transform-origin: center;
    animation: breathe 6s ease-in-out infinite alternate;
  }

  .accent-line {
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { opacity: .15; transform: translateY(0); }
    to { opacity: .45; transform: translateY(8px); }
  }

  @keyframes breathe {
    from { opacity: .85; }
    to { opacity: 1; }
  }

  @keyframes shimmer {
    from { opacity: .7; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .artwork, .accent-line {
      animation: none;
    }
  }
</style>

