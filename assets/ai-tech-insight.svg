aria-labelledby="svg-title svg-description">

<title id="svg-title">Mitigating Prompt Injection via Dual LLM Architectures</title>

<desc id="svg-description">
Prompt injection remains a critical security vulnerability in large language model integrations, where malicious user inputs override system instructions. To mitigate this risk, modern engineering teams implement a dual model architecture. A primary, heavily constrained guardrail model evaluates incoming prompts and sanitizes untrusted inputs before they reach the main reasoning model. This works by framing user data strictly as inert string variables rather than executable instructions, leveraging strict delimiter parsing and classification classifiers to detect jailbreak patterns. In production environments, this pattern prevents unauthorized data exfiltration and prompt hijacking in customer-facing conversational agents.
</desc>

<defs>
