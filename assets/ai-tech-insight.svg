  <text x="76" y="328" font-size="18" font-weight="400" fill="#CBD5E1">Compile-time memory safety without a garbage collector is achieved through the affine type</text>
<text x="76" y="360" font-size="18" font-weight="400" fill="#CBD5E1">system and lifetime annotations in languages like Rust. This system tracks how long references</text>
<text x="76" y="392" font-size="18" font-weight="400" fill="#CBD5E1">remain valid, preventing dangling pointers and buffer overflows before code execution. The</text>
<text x="76" y="424" font-size="18" font-weight="400" fill="#CBD5E1">compiler builds an explicit borrow checker graph during semantic analysis, enforcing strict</text>
<text x="76" y="456" font-size="18" font-weight="400" fill="#CBD5E1">rules where data can have multiple immutable borrows or one mutable borrow at any given time,</text>
<text x="76" y="488" font-size="18" font-weight="400" fill="#CBD5E1">eliminating entire classes of concurrency and memory corruption bugs.</text>

  <rect x="76" y="553" width="1048"
