    <stop offset="0%" stop-color="#071A1A"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#2DD4BF"/>
    <stop offset="100%" stop-color="#60A5FA"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#2DD4BF" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".10"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 8s ease-in-out infinite alternate;
  }

  .artwork {
    transform-box: fill-box;
    transform-origin: center;
    animation: breathe 6s ease-in-out infinite alternate;
  }

  .accent-line {
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { opacity: .15; transform: translateY(0); }
    to { opacity: .45; transform: translateY(8px); }
  }

  @keyframes breathe {
    from { opacity: .85; }
    to { opacity: 1; }
  }

  @keyframes shimmer {
    from { opacity: .7; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .artwork, .accent-line {
      animation: none;
    }
  }
</style>

