  <!-- Full explanation -->
  <text x="76" y="358" font-size="18" font-weight="400" fill="#CBD5E1">Prompt injection remains a critical security vulnerability in large language model integrations,</text>
<text x="76" y="390" font-size="18" font-weight="400" fill="#CBD5E1">where malicious user inputs override system instructions. To mitigate this risk, modern</text>
<text x="76" y="422" font-size="18" font-weight="400" fill="#CBD5E1">engineering teams implement a dual model architecture. A primary, heavily constrained guardrail</text>
<text x="76" y="454" font-size="18" font-weight="400" fill="#CBD5E1">model evaluates incoming prompts and sanitizes untrusted inputs before they reach the main</text>
<text x="76" y="486" font-size="18" font-weight="400" fill="#CBD5E1">reasoning model. This works by framing user data strictly as inert string variables rather than</text>
<text x="76" y="518" font-size="18" font-weight="400" fill="#CBD5E1">executable instructions, leveraging strict delimiter parsing and classification classifiers to</text>
<text x="76" y="550" font-size="18" font-weight="400" fill="#CBD5E1">detect jailbreak patterns. In production environments, this pattern prevents unauthorized data</text>
<text x="76" y="582" font-size="18" font-weight="400" fill="#CBD5E1">exfiltration and prompt hijacking in customer-facing conversational agents.</text>

