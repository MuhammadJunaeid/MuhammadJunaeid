  <text x="220" y="625" font-size="34" font-weight="700" letter-spacing="3" fill="#FBBF24">THE INSIGHT</text>
  <text x="220" y="690" font-size="39" font-weight="400" fill="#D8E3F5">Database connection pooling mitigates the high overhead of establishing new</text>
<text x="220" y="758" font-size="39" font-weight="400" fill="#D8E3F5">TCP connections by maintaining a cache of open links. However, naive</text>
<text x="220" y="826" font-size="39" font-weight="400" fill="#D8E3F5">implementations often set maximum pool sizes too high, leading to thread</text>
<text x="220" y="894" font-size="39" font-weight="400" fill="#D8E3F5">contention, memory bloat, and context switching overhead at the database</text>
<text x="220" y="962" font-size="39" font-weight="400" fill="#D8E3F5">server. When an application spikes in traffic, excess concurrent queries</text>
<text x="220" y="1030" font-size="39" font-weight="400" fill="#D8E3F5">queue up, exhausting CPU resources and degrading transaction throughput. A</text>
<text x="220" y="1098" font-size="39" font-weight="400" fill="#D8E3F5">properly tuned pool balances the database cores available with expected</text>
<text x="220" y="1166" font-size="39" font-weight="400" fill="#D8E3F5">query latency, often keeping pool sizes relatively small while relying on</text>
  <rect x="220" y="1100" width="1950" height="340" rx="32" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="2"/>
  <rect x="220" y="1100" width="10" height="340" rx="5" fill="url(#accent)"/>
  <text x="285" y="1190" font-size="34" font-weight="800" letter-spacing="4" fill="#F472B6">KEY TAKEAWAY</text>
  <text x="285" y="1280" font-size="36" font-weight="600" fill="#FFFFFF">Calculate maximum pool size based on available database CPU cores</text>
<text x="285" y="1346" font-size="36" font-weight="600" fill="#FFFFFF">and expected query duration rather than arbitrarily high application</text>
<text x="285" y="1412" font-size="36" font-weight="600" fill="#FFFFFF">concurrency limits.</text>
