  }

  .accent-line {
    animation: shimmer 5s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { opacity: .15; transform: translateY(0); }
    to { opacity: .45; transform: translateY(8px); }
  }

  @keyframes breathe {
    from { opacity: .85; }
    to { opacity: 1; }
  }

  @keyframes shimmer {
    from { opacity: .7; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .artwork, .accent-line {
      animation: none;
    }
  }
</style>

