  <text x="76" y="382" font-size="18" font-weight="400" fill="#CBD5E1">Deterministic compilation ensures that compiling identical source code produces bit-for-bit</text>
<text x="76" y="414" font-size="18" font-weight="400" fill="#CBD5E1">identical binary output regardless of the host environment. This practice matters because it</text>
<text x="76" y="446" font-size="18" font-weight="400" fill="#CBD5E1">closes critical software supply chain vectors by allowing independent auditors to verify that</text>
<text x="76" y="478" font-size="18" font-weight="400" fill="#CBD5E1">released binaries match audited source code. It works by removing non-deterministic metadata</text>
<text x="76" y="510" font-size="18" font-weight="400" fill="#CBD5E1">such as build timestamps, file system paths, and randomized memory allocations from the</text>
<text x="76" y="542" font-size="18" font-weight="400" fill="#CBD5E1">compilation pipeline. A practical use case is in operating system package management and</text>
<text x="76" y="574" font-size="18" font-weight="400" fill="#CBD5E1">cryptocurrency core clients, where users independently rebuild source code to</text>
<text x="76" y="606" font-size="18" font-weight="400" fill="#CBD5E1">cryptographically verify binaries against tampering before deployment.</text>

