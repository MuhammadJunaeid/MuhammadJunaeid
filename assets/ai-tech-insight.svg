<svg xmlns="http://www.w3.org/2000/svg"
width="1200" height="882"
viewBox="0 0 1200 882"
role="img" aria-labelledby="svg-title svg-description">

<title id="svg-title">Memory Safety Through Rust Lifetimes</title>
<desc id="svg-description">Compile-time memory safety without a garbage collector is achieved through the affine type system and lifetime annotations in languages like Rust. This system tracks how long references remain valid, preventing dangling pointers and buffer overflows before code execution. The compiler builds an explicit borrow checker graph during semantic analysis, enforcing strict rules where data can have multiple immutable borrows or one mutable borrow at any given time, eliminating entire classes of concurrency and memory corruption bugs.</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091625"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#60A5FA"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#60A5FA" stop-opacity=".20"/>
    <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="34" height="34"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".17"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 7s ease-in-out infinite alternate;
  }

  .orbit {
    transform-box: fill-box;
    transform-origin: center;
    animation: rotate 35s linear infinite;
  }

  .pulse {
    animation: pulse 4s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { transform: translateY(-5px); opacity: .2; }
    to { transform: translateY(12px); opacity: .8; }
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes pulse {
    from { opacity: .1; }
    to { opacity: .35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .orbit, .pulse { animation: none; }
  }
</style>

