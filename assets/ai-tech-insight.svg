<svg xmlns="http://www.w3.org/2000/svg"
width="1200" height="1000"
viewBox="0 0 1200 1000"
role="img" aria-labelledby="svg-title svg-description">

<title id="svg-title">Deterministic Compilation in Software Supply Chains</title>
<desc id="svg-description">Deterministic compilation ensures that compiling identical source code produces bit-for-bit identical binary output regardless of the host environment. This practice matters because it closes critical software supply chain vectors by allowing independent auditors to verify that released binaries match audited source code. It works by removing non-deterministic metadata such as build timestamps, file system paths, and randomized memory allocations from the compilation pipeline. A practical use case is in operating system package management and cryptocurrency core clients, where users independently rebuild source code to cryptographically verify binaries against tampering before deployment.</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091625"/>
    <stop offset="100%" stop-color="#17243A"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#60A5FA"/>
    <stop offset="100%" stop-color="#34D399"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#60A5FA" stop-opacity=".20"/>
    <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="34" height="34"
    patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1"
      fill="#94A3B8" opacity=".17"/>
  </pattern>
</defs>

<style>
  .particle {
    animation: float 7s ease-in-out infinite alternate;
  }

  .orbit {
    transform-box: fill-box;
    transform-origin: center;
    animation: rotate 35s linear infinite;
  }

  .pulse {
    animation: pulse 4s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { transform: translateY(-5px); opacity: .2; }
    to { transform: translateY(12px); opacity: .8; }
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes pulse {
    from { opacity: .1; }
    to { opacity: .35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .particle, .orbit, .pulse { animation: none; }
  }
</style>

