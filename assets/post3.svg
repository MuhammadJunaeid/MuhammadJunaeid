<svg xmlns="http://www.w3.org/2000/svg" width="400" height="262" viewBox="0 0 400 262" role="img" aria-label="LinkedIn post: Paste your third LinkedIn post title here">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20203f"/><stop offset="1" stop-color="#0e0e1f"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F0A" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#FF375F" stop-opacity=".85"/></linearGradient>
<linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F0A"/><stop offset="1" stop-color="#FF375F"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="c"><rect width="392" height="250" rx="30"/></clipPath>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}.b{transform-box:fill-box;transform-origin:center;animation:b 3.2s ease-in-out infinite}@keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.arr{animation:ar 1.4s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}</style>
<rect x="4" y="4" width="392" height="250" rx="30" fill="url(#bg)"/>
<g clip-path="url(#c)" transform="translate(4 4)"><circle cx="340" cy="30" r="100" fill="#FF9F0A" opacity=".5" filter="url(#bl)" class="b"/><circle cx="30" cy="240" r="80" fill="#FF375F" opacity=".3" filter="url(#bl)"/>
<rect width="90" height="250" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-200;560" dur="6s" repeatCount="indefinite"/></rect></g>
<rect x="4.75" y="4.75" width="390.5" height="248.5" rx="30" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<rect x="32" y="30" width="44" height="44" rx="13" fill="url(#ic)"/><text x="54" y="61" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">in</text>
<text x="88" y="49" font-size="12.5" font-weight="800" letter-spacing="1.6" fill="#fff">LINKEDIN</text>
<text x="88" y="66" font-size="13" fill="#9ea4d6">Oct 2026</text>
<text x="32" y="112" font-size="21" font-weight="800" fill="#fff">Paste your third LinkedIn</text><text x="32" y="138" font-size="21" font-weight="800" fill="#fff">post title here</text>
<rect x="32" y="206" width="132" height="34" rx="17" fill="url(#ic)"/><text x="50" y="228" font-size="14.5" font-weight="700" fill="#fff">Read post</text><text class="arr" x="138" y="229" font-size="16" font-weight="800" fill="#fff">→</text>
</svg>