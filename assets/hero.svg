<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Junaeid, Frontend Developer and AI Integration Specialist">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140f3a"/><stop offset=".55" stop-color="#2d2170"/><stop offset="1" stop-color="#5b3fd1"/></linearGradient>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fbc2eb"/><stop offset="1" stop-color="#ffffff"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#fbc2eb"/><stop offset="1" stop-color="#8ec5fc"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbc2eb"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<clipPath id="card"><rect width="1200" height="480" rx="28"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.l{opacity:0;animation:cycle 12s infinite}
.l2{animation-delay:4s} .l3{animation-delay:8s}
@keyframes cycle{0%{opacity:0;transform:translateY(16px)}4%,30%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-12px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.core{transform-box:fill-box;transform-origin:center;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2.2s .4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="480" fill="url(#bg)"/>
<circle cx="900" cy="120" r="170" fill="#fbc2eb" opacity=".5" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;-90 60;40 100;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1060" cy="390" r="200" fill="#8ec5fc" opacity=".38" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;60 -80;-60 -30;0 0" dur="17s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="470" r="170" fill="#a18cd1" opacity=".5" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;120 -40;-80 -60;0 0" dur="19s" repeatCount="indefinite"/></circle>
<circle cx="60" cy="40" r="2.2" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle cx="320" cy="30" r="1.4" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" begin="2.5s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="50" r="1.4" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="3.5s" begin="1.7s" repeatCount="indefinite"/></circle>
<circle cx="1140" cy="60" r="1.8" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="1100" cy="200" r="2.6" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" begin="0.7s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="210" r="2.6" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" begin="2.5s" repeatCount="indefinite"/></circle>
<circle cx="40" cy="300" r="1.4" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="3s" begin="1.9s" repeatCount="indefinite"/></circle>
<circle cx="660" cy="310" r="1.4" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="4s" begin="0.1s" repeatCount="indefinite"/></circle>
<circle cx="1170" cy="310" r="1.8" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" begin="1.7s" repeatCount="indefinite"/></circle>
<circle cx="520" cy="40" r="1.8" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="3.5s" begin="1.3s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="450" r="1.4" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="3.5s" begin="1.7s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="455" r="1.8" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" begin="1.7s" repeatCount="indefinite"/></circle>
<circle cx="430" cy="458" r="1.8" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="3.5s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="55" r="1.4" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="2.5s" begin="1.9s" repeatCount="indefinite"/></circle>
<circle cx="1000" cy="120" r="2.6" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="4s" begin="2.3s" repeatCount="indefinite"/></circle>
<circle cx="260" cy="200" r="2.6" fill="#fff"><animate attributeName="opacity" values=".1;1;.1" dur="4s" begin="1.1s" repeatCount="indefinite"/></circle>

<!-- orbit emblem -->
<g transform="translate(960 250)">
<circle r="150" fill="none" stroke="#fff" stroke-opacity=".18" stroke-dasharray="3 9"/>
<circle r="104" fill="none" stroke="#fbc2eb" stroke-opacity=".35" stroke-dasharray="2 7"/>
<g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
<circle cx="150" r="9" fill="#fbc2eb"/><circle cx="-150" r="5" fill="#8ec5fc"/></g>
<g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
<circle cx="104" r="7" fill="#fff"/><circle cx="-104" r="4" fill="#fbc2eb"/></g>
<circle r="62" fill="#fbc2eb" opacity=".5" filter="url(#glow)" class="core"/>
<circle r="56" fill="url(#core)" class="core"/>
<text y="14" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">&lt;AI/&gt;</text>
</g>
<!-- availability -->
<rect x="80" y="62" width="372" height="42" rx="21" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".3"/>
<circle cx="106" cy="83" r="6" fill="#4ade80"/>
<circle cx="106" cy="83" r="6" fill="#4ade80" class="pulse"/>
<text x="126" y="89" font-size="17" fill="#fff" font-weight="600">Available for work · Frontend + AI</text>
<!-- name -->
<text x="76" y="212" font-size="104" font-weight="800" letter-spacing="3" fill="url(#name)">JUNAEID</text>
<path d="M82 238 H482" stroke="url(#line)" stroke-width="5" stroke-linecap="round" pathLength="400" class="draw" fill="none"/>
<text x="80" y="292" font-size="28" fill="#e9defc" font-weight="500">Frontend Developer × AI Integration Specialist</text>
<!-- rotating promise -->
<text class="l" x="80" y="354" font-size="32" font-weight="700" fill="#fff">I build websites people love to use.</text>
<text class="l l2" x="80" y="354" font-size="32" font-weight="700" fill="#fff">I put AI to work inside real products.</text>
<text class="l l3" x="80" y="354" font-size="32" font-weight="700" fill="#fbc2eb">Let's build yours. Message me.</text>
<text x="80" y="428" font-size="17" fill="#cbb8f5">30+ certifications · Anthropic · Google · UN University · FAO · LinkedIn Learning</text>
</g>
<rect x=".5" y=".5" width="1199" height="479" rx="28" fill="none" stroke="#fff" stroke-opacity=".18"/>
</svg>