</defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .f{animation:fl 5s ease-in-out infinite} @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}</style>
<g transform="translate(0 10)"><g class="f" style="animation-delay:0.0s">
