<text x="185" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Certifications</text>
<text x="185" y="154" text-anchor="middle" font-size="15" fill="#cbb8f5">Anthropic · Google · UN University · FAO</text>
</g></g><g transform="translate(415 10)"><g class="f" style="animation-delay:0.8s">
<rect width="370" height="190" rx="26" fill="url(#cd)" stroke="url(#st)" stroke-width="1.5"/>
<text x="185" y="86" text-anchor="middle" font-size="68" font-weight="800" fill="url(#nm)">2×</text>
<text x="185" y="124" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Tech + Business lens</text>
<text x="185" y="154" text-anchor="middle" font-size="15" fill="#cbb8f5">Builder's craft with a BBA mindset</text>
</g></g><g transform="translate(830 10)"><g class="f" style="animation-delay:1.6s">
<rect width="370" height="190" rx="26" fill="url(#cd)" stroke="url(#st)" stroke-width="1.5"/>
