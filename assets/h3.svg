<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Featured work">
<defs><linearGradient id="hb" x1="0" x2="1"><stop offset="0" stop-color="#1c1c3c"/><stop offset="1" stop-color="#0e0e22"/></linearGradient>
<linearGradient id="hd" x1="0" x2="1"><stop offset="0" stop-color="#FF9F0A"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#FF375F"/></linearGradient>
<linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F0A"/><stop offset="1" stop-color="#FF375F"/></linearGradient>
<linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
<clipPath id="c"><rect width="1200" height="96" rx="28"/></clipPath></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}

.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.fl{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.dot{transform-box:fill-box;transform-origin:center;animation:dp 1.8s ease-in-out infinite}@keyframes dp{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.2);opacity:1}}</style>
<rect width="1200" height="96" rx="28" fill="url(#hb)"/>
<g clip-path="url(#c)"><circle cx="64" cy="48" r="46" fill="#FF9F0A" opacity=".55" filter="url(#bl)" class="breathe"/><rect y="0" width="260" height="96" fill="url(#sheen)" transform="skewX(-20)"><animate attributeName="x" values="-300;1400" dur="6s" repeatCount="indefinite"/></rect></g>
<rect x=".75" y=".75" width="1198.5" height="94.5" rx="28" fill="none" stroke="url(#hd)" stroke-width="1.5"/>
<circle cx="64" cy="48" r="27" fill="url(#chip)"/>
<text x="64" y="58" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">03</text>
<text x="114" y="46" font-size="34" font-weight="800" fill="#fff">Featured work</text>
<text x="114" y="73" font-size="16.5" fill="#9ea4d6">Things I've built and researched</text>
<circle class="dot" cx="1126" cy="48" r="6" fill="#0A84FF"/><circle class="dot" style="animation-delay:.3s" cx="1148" cy="48" r="6" fill="#BF5AF2"/><circle class="dot" style="animation-delay:.6s" cx="1170" cy="48" r="6" fill="#FF375F"/>
</svg>