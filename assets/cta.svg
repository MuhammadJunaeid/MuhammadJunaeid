<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" role="img" aria-label="Let's build something great">
<defs>
<linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".55" stop-color="#c36bd9"/><stop offset="1" stop-color="#fbc2eb"/></linearGradient>
<filter id="g" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
<clipPath id="c"><rect x="20" y="20" width="560" height="80" rx="40"/></clipPath>
</defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .glow{animation:gl 2.4s ease-in-out infinite} @keyframes gl{0%,100%{opacity:.35}50%{opacity:.9}} .arr{animation:ar 1.4s ease-in-out infinite} @keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}</style>
<rect class="glow" x="30" y="30" width="540" height="70" rx="35" fill="url(#b)" filter="url(#g)"/>
<rect x="20" y="20" width="560" height="80" rx="40" fill="url(#b)"/>
<g clip-path="url(#c)"><rect y="10" width="70" height="110" fill="#fff" opacity=".35" transform="skewX(-22)"><animate attributeName="x" values="-120;700" dur="3.2s" repeatCount="indefinite"/></rect></g>
<text x="290" y="71" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">Let's build something great</text>
<text class="arr" x="505" y="72" font-size="30" font-weight="800" fill="#fff">→</text>
</svg>