<svg xmlns="http://www.w3.org/2000/svg" width="400" height="262" viewBox="0 0 400 262" role="img" aria-label="Hiring?">
<defs><linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20203f"/><stop offset="1" stop-color="#0e0e1f"/></linearGradient><linearGradient id="dbd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A84FF" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#64D2FF" stop-opacity=".85"/></linearGradient><linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A84FF"/><stop offset="1" stop-color="#64D2FF"/></linearGradient>
<linearGradient id="pill" x1="0" x2="1"><stop offset="0" stop-color="#0A84FF"/><stop offset="1" stop-color="#64D2FF"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="c"><rect width="392" height="250" rx="30"/></clipPath></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}

.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.fl{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.arr{animation:ar 1.4s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}</style>
<rect x="4" y="4" width="392" height="250" rx="30" fill="url(#dbg)"/>
<g clip-path="url(#c)" transform="translate(4 4)"><circle cx="340" cy="30" r="100" fill="#0A84FF" opacity=".5" filter="url(#bl)" class="breathe"/><circle cx="30" cy="240" r="80" fill="#64D2FF" opacity=".3" filter="url(#bl)"/>
<rect width="90" height="250" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-200;560" dur="6s" repeatCount="indefinite"/></rect></g>
<rect x="4.75" y="4.75" width="390.5" height="248.5" rx="30" fill="none" stroke="url(#dbd)" stroke-width="1.5"/>
<rect x="32" y="32" width="62" height="62" rx="18" fill="url(#ic)"/>
<rect x="32" y="32" width="62" height="31" rx="18" fill="#fff" opacity=".18"/>
<g transform="translate(63 63)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-15" y="-8" width="30" height="22" rx="5"/><path d="M-6,-8 V-12 a3,3 0 0 1 3,-3 h6 a3,3 0 0 1 3,3 V-8 M-15,2 H15"/></g>
<text x="32" y="130" font-size="26" font-weight="800" fill="#fff">Hiring?</text>
<text x="32" y="160" font-size="16" fill="#aeb3e2">Frontend + AI, ready to ship</text>
<text x="32" y="183" font-size="16" fill="#aeb3e2">from week one.</text>
<rect x="32" y="200" width="163" height="38" rx="19" fill="url(#pill)"/>
<text x="52" y="225" font-size="15.5" font-weight="700" fill="#fff">See my work</text>
<text class="arr" x="165" y="226" font-size="17" font-weight="800" fill="#fff">→</text>
</svg>