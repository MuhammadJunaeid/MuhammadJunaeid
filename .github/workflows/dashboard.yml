name: Update dashboard
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/make_dashboard.py"
      - "scripts/make_train.py"
permissions:
  contents: write
concurrency:
  group: profile-writes
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/make_dashboard.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          TZ_OFFSET: "6"
      - run: python scripts/make_train.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          TZ_OFFSET: "6"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg assets/train.svg
          git commit -m "chore: update dashboard" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }}
          git push
