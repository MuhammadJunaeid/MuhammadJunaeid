name: Automated Tech Insight

on:
  schedule:
    # 13:45 Bangladesh time (UTC+6)
    - cron: "45 7 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-tech-insight
  cancel-in-progress: false

jobs:
  generate-insight:
    name: Generate and publish daily insight
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify SDK version
        run: |
          python -c "from importlib.metadata import version; v=version('google-genai'); print('google-genai:', v); assert tuple(map(int, v.split('.')[:2])) >= (2, 0), 'google-genai 2.0.0 or newer is required'"

      - name: Generate daily insight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/generate_insight.py

      - name: Validate generated files
        run: |
          python -m json.tool data/insight.json > /dev/null
          python -c "from pathlib import Path; files=['README.md','data/insight.json','assets/ai-tech-insight.svg']; missing=[f for f in files if not Path(f).is_file() or Path(f).stat().st_size == 0]; assert not missing, f'Missing or empty files: {missing}'"
          git diff --check

      - name: Publish generated insight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md data/insight.json assets/ai-tech-insight.svg

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "chore: publish daily technology insight"
          git push
