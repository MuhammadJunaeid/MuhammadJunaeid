name: Automated Tech Insight

on:
  schedule:
    - cron: "17 */3 * * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-tech-insight
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate new insight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          TIMEZONE: Asia/Dhaka
        run: python scripts/generate_insight.py

      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add assets/ai-tech-insight.svg
          git add data/latest-insight.json
          git add data/insight-history.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "chore: publish automated tech insight"
          git push
