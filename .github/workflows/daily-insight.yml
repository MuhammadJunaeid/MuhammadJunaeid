
name: Daily AI Tech Insight

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-ai-tech-insight
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish technology insight
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate daily insight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/generate_insight.py

      - name: Validate generated files
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "[1/7] Checking README..."
          test -s README.md
          echo "PASS"

          echo "[2/7] Checking insight JSON..."
          test -s data/insight.json
          echo "PASS"

          echo "[3/7] Checking SVG..."
          test -s assets/ai-tech-insight.svg
          echo "PASS"

          echo "[4/7] Validating JSON..."
          python -m json.tool data/insight.json > /dev/null
          echo "PASS"

          echo "[5/7] Validating dynamic SVG..."
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("assets/ai-tech-insight.svg")
          root = ET.parse(path).getroot()

          assert root.tag.endswith("svg"), "Invalid SVG root"

          width = int(root.attrib["width"])
          height = int(root.attrib["height"])
          viewbox = root.attrib["viewBox"].split()

          assert width == 1200, "Incorrect SVG width"
          assert height > 630, "Dynamic height missing"
          assert viewbox == ["0", "0", "1200", str(height)], \
              "Incorrect SVG viewBox"

          print(f"PASS: SVG dimensions {width} x {height}")
          PY

          echo "[6/7] Checking README markers..."
          python - <<'PY'
          from pathlib import Path

          text = Path("README.md").read_text(encoding="utf-8")

          assert text.count("<!-- INSIGHT:START -->") == 1
          assert text.count("<!-- INSIGHT:END -->") == 1

          print("PASS: README markers")
          PY

          echo "[7/7] Checking Git whitespace..."
          git diff --check
          echo "PASS"

          echo "ALL CHECKS PASSED"

      - name: Commit generated files
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add data/insight.json
          git add assets/ai-tech-insight.svg

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git diff --cached --check

          git commit -m "Update daily AI tech insight"

          gh auth setup-git
          git push origin "HEAD:${DEFAULT_BRANCH}"

