
name: Daily AI Tech Insight

on:
  schedule:
    # 09:00 Bangladesh time (03:00 UTC)
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-ai-tech-insight
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish insight
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate AI insight and SVG
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/generate_insight.py

      
      - name: Diagnose generated files
        shell: bash
        run: |
          echo "===== GENERATION DIAGNOSTICS ====="

          FAILED=0

          echo ""
          echo "[1/6] README.md"
          if test -s README.md; then
            echo "PASS: README exists"
          else
            echo "::error::README.md missing or empty"
            FAILED=1
          fi

          echo ""
          echo "[2/6] Insight JSON"
          if test -s data/insight.json; then
            echo "PASS: JSON file exists"
          else
            echo "::error::data/insight.json missing or empty"
            FAILED=1
          fi

          echo ""
          echo "[3/6] SVG graphic"
          if test -s assets/ai-tech-insight.svg; then
            echo "PASS: SVG exists"
          else
            echo "::error::SVG missing or empty"
            FAILED=1
          fi

          echo ""
          echo "[4/6] JSON syntax"
          if python -m json.tool data/insight.json > /dev/null 2>&1; then
            echo "PASS: Valid JSON"
          else
            echo "::error::Invalid JSON"
            FAILED=1
          fi

          echo ""
          echo "[5/6] SVG structure"
          if python -c "import xml.etree.ElementTree as E; r=E.parse('assets/ai-tech-insight.svg').getroot(); assert r.tag.endswith('svg'); print('PASS: Valid SVG')" 2>&1; then
            :
          else
            echo "::error::Invalid SVG"
            FAILED=1
          fi

          echo ""
          echo "[6/6] Git whitespace"
          if git diff --check; then
            echo "PASS: No whitespace errors"
          else
            echo "::error::Whitespace errors detected"
            FAILED=1
          fi

          echo ""
          echo "===== FILE STATUS ====="
          git status --short

          echo ""
          echo "===== FILE SIZES ====="
          ls -lh README.md data/insight.json assets/ai-tech-insight.svg 2>&1 || true

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more validation checks failed."
            exit 1
          fi

          echo "All validation checks passed."


      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add data/insight.json
          git add assets/ai-tech-insight.svg

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update daily AI tech insight and visual"

          gh auth setup-git

          git push origin "HEAD:${DEFAULT_BRANCH}"
