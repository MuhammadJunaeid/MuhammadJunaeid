
name: Daily AI Tech Insight

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-ai-tech-insight
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate daily insight and visual
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/generate_insight.py

      - name: Validate generated files
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "================================"
          echo "STARTING REPOSITORY VALIDATION"
          echo "================================"

          echo "[1/6] Checking README..."
          if [[ ! -s README.md ]]; then
            echo "::error::README.md is missing or empty."
            exit 1
          fi
          echo "PASS: README.md"

          echo "[2/6] Checking insight JSON..."
          if [[ ! -s data/insight.json ]]; then
            echo "::error::data/insight.json is missing or empty."
            exit 1
          fi
          echo "PASS: insight.json"

          echo "[3/6] Checking SVG..."
          if [[ ! -s assets/ai-tech-insight.svg ]]; then
            echo "::error::assets/ai-tech-insight.svg is missing or empty."
            exit 1
          fi
          echo "PASS: SVG exists"

          echo "[4/6] Validating JSON..."
          python -m json.tool data/insight.json > /dev/null
          echo "PASS: JSON syntax"

          echo "[5/6] Validating SVG XML..."
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("assets/ai-tech-insight.svg")
          root = ET.parse(path).getroot()

          if not root.tag.endswith("svg"):
              raise SystemExit("Invalid SVG root element.")

          if root.attrib.get("viewBox") != "0 0 1200 630":
              raise SystemExit("Unexpected SVG viewBox.")

          print("PASS: SVG XML and dimensions")
          PY

          echo "[6/6] Checking Git whitespace..."
          git diff --check
          echo "PASS: No whitespace errors"

          echo "================================"
          echo "ALL VALIDATION CHECKS PASSED"
          echo "================================"

      - name: Commit generated files
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add data/insight.json
          git add assets/ai-tech-insight.svg

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git diff --cached --check

          git commit -m "Update daily AI tech insight"

          gh auth setup-git

          git push origin "HEAD:${DEFAULT_BRANCH}"
