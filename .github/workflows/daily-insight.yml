name: Automated Tech Insight Publisher

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-tech-insight-publisher
  cancel-in-progress: false

jobs:
  publish-insight:
    name: Generate and publish AI Tech Insight
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -s README.md
          test -s scripts/generate_insight.py
          test -d data
          test -d assets

      - name: Generate new insight and artwork
        run: python scripts/generate_insight.py

      - name: Validate generated files
        run: |
          python -m json.tool data/insight.json > /dev/null

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          svg = Path("assets/ai-tech-insight.svg")

          assert svg.is_file(), "SVG missing"
          assert svg.stat().st_size > 1000, "SVG too small"

          root = ET.parse(svg).getroot()

          assert root.attrib["width"] == "3840"
          assert root.attrib["height"] == "2160"

          print("SVG validation passed.")
          PY

          git diff --check

      - name: Commit generated publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md data/insight.json assets/ai-tech-insight.svg

          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi

          git commit -m "Publish AI Tech Insight"
          git push
