name: AI Tech Insight Publisher

on:
  schedule:
    # Every 3 hours: 00:00, 03:00, 06:00 ... UTC
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-tech-insight-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish new insight
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate insight and artwork
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/generate_insight.py

      - name: Validate JSON
        run: |
          python -m json.tool data/insight.json > /dev/null

      - name: Validate generated SVG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("assets/ai-tech-insight.svg")
          root = ET.parse(path).getroot()

          assert root.tag.endswith("svg")
          assert root.attrib["width"] == "1200"

          height = int(root.attrib["height"])
          assert height > 630

          text = path.read_text(encoding="utf-8")

          assert "KEY TAKEAWAY" in text
          assert "CREATED BY MUHAMMAD JUNAEID" in text
          assert "@keyframes" in text

          print(f"SVG valid: 1200 x {height}")
          PY

      - name: Validate README
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          data = json.loads(
              Path("data/insight.json").read_text(encoding="utf-8")
          )

          assert readme.count("<!-- INSIGHT:START -->") == 1
          assert readme.count("<!-- INSIGHT:END -->") == 1

          assert f"?v={data['cache_token']}" in readme

          print("README validation passed.")
          PY

      - name: Check Git formatting
        run: |
          git diff --check

      - name: Commit generated publication
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add data/insight.json
          git add assets/ai-tech-insight.svg

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git diff --cached --check

          git commit -m "Publish AI tech insight"

          git push origin "HEAD:${DEFAULT_BRANCH}"

          echo "Publication successfully pushed."
