
name: Daily AI Tech Insight

on:
  schedule:
    # 09:00 Bangladesh time (03:00 UTC)
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-ai-tech-insight
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish insight
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Generate AI insight and SVG
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/generate_insight.py

      
      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking whitespace..."
          git diff --check

          echo "Checking README..."
          test -s README.md || {
            echo "::error::README.md is missing or empty."
            exit 1
          }

          echo "Checking insight JSON..."
          test -s data/insight.json || {
            echo "::error::insight.json is missing or empty."
            exit 1
          }

          echo "Checking SVG..."
          test -s assets/ai-tech-insight.svg || {
            echo "::error::SVG is missing or empty."
            exit 1
          }

          echo "Validating JSON syntax..."
          python -m json.tool data/insight.json > /dev/null

          echo "Validating SVG structure..."
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("assets/ai-tech-insight.svg")
          root = ET.parse(path).getroot()

          assert root.tag.endswith("svg"), "Invalid SVG root element"
          assert root.attrib.get("viewBox") == "0 0 1200 630", "Unexpected SVG dimensions"

          print("SVG structure is valid.")
          PY

          echo "All validation checks passed."


      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add data/insight.json
          git add assets/ai-tech-insight.svg

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update daily AI tech insight and visual"

          gh auth setup-git

          git push origin "HEAD:${DEFAULT_BRANCH}"
