name: Automated Tech Insight

on:
  schedule:
    # Every 3 hours at minute 45 (UTC).
    - cron: "45 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-tech-insight
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and Publish Insight

    runs-on: ubuntu-latest

    timeout-minutes: 5

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      GEMINI_MODEL: gemini-3.8-flash

      GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY is missing."
            exit 1
          fi

          if [[ ! -f scripts/generate_insight.py ]]; then
            echo "::error::Generator script not found."
            exit 1
          fi

          if [[ ! -f README.md ]]; then
            echo "::error::README.md not found."
            exit 1
          fi

          echo "Configuration validated."

      - name: Generate technology insight
        run: python scripts/generate_insight.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = json.loads(
              Path("data/insight.json").read_text(
                  encoding="utf-8"
              )
          )

          required = {
              "title",
              "category",
              "explanation",
              "takeaway",
              "date",
              "author",
          }

          missing = required - data.keys()

          if missing:
              raise SystemExit(
                  f"Missing JSON fields: {missing}"
              )

          svg = ET.parse(
              "assets/ai-tech-insight.svg"
          ).getroot()

          if svg.tag.split("}")[-1] != "svg":
              raise SystemExit("Invalid SVG root.")

          if svg.attrib.get("viewBox") != "0 0 3840 2160":
              raise SystemExit("Invalid SVG dimensions.")

          readme = Path("README.md").read_text(
              encoding="utf-8"
          )

          if readme.count("<!-- INSIGHT:START -->") != 1:
              raise SystemExit("Invalid start marker.")

          if readme.count("<!-- INSIGHT:END -->") != 1:
              raise SystemExit("Invalid end marker.")

          print("All publication files validated.")
          print("Insight:", data["title"])
          print("Category:", data["category"])
          PY

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            README.md \
            data/insight.json \
            assets/ai-tech-insight.svg

          if git diff --cached --quiet; then
            echo "No publication changes detected."
            exit 0
          fi

          git commit -m \
            "docs: publish automated technology insight"

          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Workflow summary
        if: success()
        run: |
          echo "## Automated Tech Insight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Publication completed successfully." >> "$GITHUB_STEP_SUMMARY"
