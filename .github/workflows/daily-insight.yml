
name: Daily AI Tech Insight

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

# No permissions at workflow level.
# Grant only the required permission to this job.
permissions: {}

concurrency:
  group: daily-tech-insight
  cancel-in-progress: false

jobs:
  generate-insight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --no-input -r requirements.txt

      - name: Generate and validate insight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_insight.py

      - name: Check changes
        run: |
          git diff --check
          git status --short

      - name: Commit and publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md data/insight.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Update daily AI tech insight"

          gh auth setup-git

          git push origin "HEAD:${DEFAULT_BRANCH}"
