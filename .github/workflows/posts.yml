name: Update LinkedIn posts
on:
  push:
    paths:
      - "posts.json"
      - "scripts/make_posts.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-writes
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/make_posts.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git commit -m "chore: update LinkedIn posts" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }}
          git push
